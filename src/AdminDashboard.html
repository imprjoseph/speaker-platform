<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: "Microsoft JhengHei", -apple-system, sans-serif; margin: 0; background: #F4F6FA; color: #222; }
    header { background: #1F3864; color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    nav { display: flex; gap: 8px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #ddd; }
    nav button { background: none; border: none; padding: 8px 12px; cursor: pointer; font-size: 14px; border-radius: 6px; }
    nav button.active { background: #1F3864; color: #fff; }
    main { padding: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
    th { color: #555; }
    .pill { padding: 2px 8px; border-radius: 10px; background: #eee; font-size: 12px; }
    .pill.warn { background: #fbdada; color: #a10c0c; }
    button.action { background: #1F3864; color: #fff; border: none; padding: 6px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; margin-right: 4px; }
    button.action.reject { background: #a10c0c; }
    button.action.secondary { background: #eee; color: #222; }
    input, select { padding: 6px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; }
    .stat { background: #F4F6FA; border-radius: 8px; padding: 12px; text-align: center; }
    .stat .num { font-size: 22px; font-weight: 700; color: #1F3864; }
    .stat .lbl { font-size: 12px; color: #666; }
    .row-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>講者協作與會務追蹤平台</h1>
    <span id="whoami" style="font-size:12px;opacity:.85"></span>
  </header>
  <nav>
    <button class="active" onclick="showTab('activities')">活動</button>
    <button onclick="showTab('board')">講者與任務</button>
    <button onclick="showTab('mail')">郵件待審（窗口確認）</button>
  </nav>
  <main>
    <section id="tab-activities">
      <div class="card">
        <h3>建立活動</h3>
        <div class="row-form">
          <input id="a_nameZh" placeholder="活動名稱（中）">
          <input id="a_startDate" type="date">
          <input id="a_venue" placeholder="會場">
          <button class="action" onclick="createActivity()">建立</button>
        </div>
      </div>
      <div class="card">
        <h3>活動列表</h3>
        <table id="activityTable"><thead><tr><th>名稱</th><th>日期</th><th>狀態</th><th></th></tr></thead><tbody></tbody></table>
      </div>
    </section>

    <section id="tab-board" style="display:none">
      <div class="card">
        <div class="row-form">
          <select id="boardActivitySelect" onchange="loadBoard()"></select>
          <button class="action secondary" onclick="exportRoster()">匯出講者總表</button>
          <button class="action secondary" onclick="exportMissing()">匯出缺件表</button>
        </div>
        <div class="grid" id="dashboardStats"></div>
      </div>
      <div class="card">
        <h3>新增講者</h3>
        <div class="row-form">
          <input id="s_nameZh" placeholder="姓名">
          <input id="s_email" placeholder="Email">
          <input id="s_title" placeholder="職稱">
          <input id="s_org" placeholder="單位">
          <button class="action" onclick="addSpeaker()">加入並產生邀請連結</button>
        </div>
      </div>
      <div class="card">
        <h3>逐項狀態</h3>
        <table id="boardTable"><thead><tr><th>講者</th><th>邀請狀態</th><th>缺件</th><th>項目明細</th><th></th></tr></thead><tbody></tbody></table>
      </div>
    </section>

    <section id="tab-mail" style="display:none">
      <div class="card">
        <p style="font-size:13px;color:#555">下列信件皆已排入佇列，<b>尚未寄出</b>。請窗口逐封確認，確認後系統會立即寄出；也可以先寄測試信給自己核對內容。</p>
        <table id="mailTable"><thead><tr><th>收件人</th><th>主旨</th><th>語言</th><th>狀態</th><th></th></tr></thead><tbody></tbody></table>
      </div>
    </section>
  </main>

  <script>
    var currentActivityId = null;

    function showTab(name) {
      ['activities', 'board', 'mail'].forEach(function (t) {
        document.getElementById('tab-' + t).style.display = (t === name) ? 'block' : 'none';
      });
      Array.from(document.querySelectorAll('nav button')).forEach(function (b) { b.classList.remove('active'); });
      event.target.classList.add('active');
      if (name === 'mail') loadMailQueue();
    }

    function init() {
      google.script.run.withSuccessHandler(function (u) {
        document.getElementById('whoami').textContent = u.name + (u.role ? '（' + u.role + '）' : '（尚未授權）');
      }).api_currentUser();
      loadActivities();
    }

    function loadActivities() {
      google.script.run.withSuccessHandler(function (list) {
        var tbody = document.querySelector('#activityTable tbody');
        tbody.innerHTML = '';
        var select = document.getElementById('boardActivitySelect');
        select.innerHTML = '';
        list.forEach(function (a) {
          tbody.innerHTML += '<tr><td>' + a.NameZh + '</td><td>' + a.StartDate + '</td><td><span class="pill">' + a.Status + '</span></td>' +
            '<td><button class="action secondary" onclick="openBoard(\'' + a.ActivityId + '\')">開啟</button></td></tr>';
          select.innerHTML += '<option value="' + a.ActivityId + '">' + a.NameZh + '</option>';
        });
        if (list.length) { currentActivityId = list[0].ActivityId; loadBoard(); }
      }).api_listActivities();
    }

    function createActivity() {
      var input = {
        nameZh: document.getElementById('a_nameZh').value,
        startDate: document.getElementById('a_startDate').value,
        venue: document.getElementById('a_venue').value
      };
      if (!input.nameZh || !input.startDate) { alert('請填寫活動名稱與日期'); return; }
      google.script.run.withSuccessHandler(loadActivities).withFailureHandler(alertErr).api_createActivity(input);
    }

    function openBoard(activityId) {
      currentActivityId = activityId;
      document.getElementById('boardActivitySelect').value = activityId;
      showTab('board');
      document.querySelectorAll('nav button')[1].classList.add('active');
      loadBoard();
    }

    function loadBoard() {
      currentActivityId = document.getElementById('boardActivitySelect').value || currentActivityId;
      if (!currentActivityId) return;
      google.script.run.withSuccessHandler(renderDashboard).api_getDashboard(currentActivityId);
      google.script.run.withSuccessHandler(renderBoard).api_getTaskBoard(currentActivityId);
    }

    function renderDashboard(d) {
      document.getElementById('dashboardStats').innerHTML =
        stat_(d.completionRate + '%', '完成率') + stat_(d.overdueSpeakers.length, '逾期講者') +
        stat_(d.atRiskSpeakers.length, '高風險講者') + stat_(d.notOpenedSpeakers.length, '未開啟');
    }
    function stat_(num, lbl) { return '<div class="stat"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>'; }

    function renderBoard(board) {
      var tbody = document.querySelector('#boardTable tbody');
      tbody.innerHTML = '';
      board.forEach(function (b) {
        var itemsText = b.items.map(function (i) { return i.label + '：' + i.status; }).join('｜');
        tbody.innerHTML += '<tr><td>' + b.speakerName + '</td><td>' + b.inviteStatus + '</td>' +
          '<td>' + (b.missingCount ? '<span class="pill warn">' + b.missingCount + '</span>' : '<span class="pill">0</span>') + '</td>' +
          '<td style="font-size:12px">' + itemsText + '</td>' +
          '<td><button class="action secondary" onclick="composeInvite(\'' + b.activitySpeakerId + '\')">排入邀請信</button></td></tr>';
      });
    }

    function addSpeaker() {
      if (!currentActivityId) { alert('請先選擇活動'); return; }
      var speakerInput = {
        nameZh: document.getElementById('s_nameZh').value, email: document.getElementById('s_email').value,
        title: document.getElementById('s_title').value, organization: document.getElementById('s_org').value
      };
      if (!speakerInput.nameZh) { alert('請輸入姓名'); return; }
      google.script.run.withSuccessHandler(function (res) {
        if (res.duplicateWarning) alert(res.duplicateWarning);
        loadBoard();
      }).withFailureHandler(alertErr).api_addSpeaker(currentActivityId, speakerInput, {});
    }

    function composeInvite(activitySpeakerId) {
      var lang = confirm('英文範本請按「確定」，中文請按「取消」') ? 'TPL_INVITE_EN' : 'TPL_INVITE_ZH';
      google.script.run.withSuccessHandler(function () {
        alert('已排入待審佇列，請至「郵件待審」分頁確認寄出。');
      }).withFailureHandler(alertErr).api_composeInviteMail(activitySpeakerId, lang);
    }

    function loadMailQueue() {
      google.script.run.withSuccessHandler(renderMailQueue).api_listMailQueue(null, null);
    }

    function renderMailQueue(rows) {
      var tbody = document.querySelector('#mailTable tbody');
      tbody.innerHTML = '';
      rows.forEach(function (m) {
        var actions = '';
        if (m.Status === '待確認') {
          actions = '<button class="action" onclick="approveMail(\'' + m.QueueId + '\')">確認寄出</button>' +
            '<button class="action reject" onclick="rejectMail(\'' + m.QueueId + '\')">拒絕</button>' +
            '<button class="action secondary" onclick="testSend(\'' + m.QueueId + '\')">寄測試信</button>';
        }
        tbody.innerHTML += '<tr><td>' + m.ToEmail + '</td><td>' + m.RenderedSubject + '</td><td>' + m.Language + '</td>' +
          '<td><span class="pill">' + m.Status + '</span></td><td>' + actions + '</td></tr>';
      });
    }

    function approveMail(id) {
      if (!confirm('確認要立即寄出這封信嗎？')) return;
      google.script.run.withSuccessHandler(loadMailQueue).withFailureHandler(alertErr).api_approveMail(id);
    }
    function rejectMail(id) {
      var reason = prompt('拒絕原因（選填）：') || '';
      google.script.run.withSuccessHandler(loadMailQueue).withFailureHandler(alertErr).api_rejectMail(id, reason);
    }
    function testSend(id) {
      var email = prompt('測試信收件人 Email：', document.getElementById('whoami').textContent);
      if (!email) return;
      google.script.run.withSuccessHandler(function () { alert('測試信已寄出'); }).withFailureHandler(alertErr).api_testSendMail(id, email);
    }

    function exportRoster() {
      google.script.run.withSuccessHandler(function (r) { window.open(r.url, '_blank'); }).api_exportRoster(currentActivityId);
    }
    function exportMissing() {
      google.script.run.withSuccessHandler(function (r) { window.open(r.url, '_blank'); }).api_exportMissing(currentActivityId);
    }

    function alertErr(err) { alert('發生錯誤：' + err.message); }

    init();
  </script>
</body>
</html>
