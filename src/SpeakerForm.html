<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: "Microsoft JhengHei", -apple-system, sans-serif; margin: 0; background: #F4F6FA; color: #222; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    header { background: #1F3864; color: #fff; padding: 20px 16px; }
    header h1 { font-size: 18px; margin: 0 0 4px; }
    header p { margin: 0; font-size: 13px; opacity: .85; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin-top: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .field .meta { font-size: 12px; color: #777; margin-bottom: 6px; }
    input[type=text], input[type=date], textarea, select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    textarea { min-height: 70px; }
    .status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #eee; margin-left: 6px; }
    .status.done { background: #d7f0d7; color: #1a6d1a; }
    .status.overdue { background: #fbdada; color: #a10c0c; }
    .status.filling { background: #fff3cd; color: #8a6400; }
    button { background: #1F3864; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button.secondary { background: #fff; color: #1F3864; border: 1px solid #1F3864; }
    button.small { padding: 6px 10px; font-size: 12px; }
    .actions { display: flex; gap: 10px; margin-top: 8px; }
    .banner { padding: 12px; border-radius: 6px; background: #fff3cd; font-size: 14px; margin-bottom: 12px; }
    .error { padding: 24px; text-align: center; color: #a10c0c; }
  </style>
</head>
<body>
  <? if (!valid) { ?>
    <div class="error"><p><?= invalidReason ?></p></div>
  <? } else { ?>
    <header>
      <h1 id="activityTitle">載入中…</h1>
      <p id="activityMeta"></p>
    </header>
    <div class="wrap">
      <div id="inviteBanner"></div>
      <div class="card" id="fieldsCard">
        <p>載入表單中…</p>
      </div>
    </div>
  <? } ?>

  <script>
    var TOKEN = <?!= JSON.stringify(token) ?>;

    function load() {
      google.script.run.withSuccessHandler(render).withFailureHandler(showError).getSpeakerFormData(TOKEN);
    }

    function showError(err) {
      document.getElementById('fieldsCard').innerHTML = '<p style="color:#a10c0c">' + err.message + '</p>';
    }

    function render(data) {
      document.getElementById('activityTitle').textContent = data.activityName;
      document.getElementById('activityMeta').textContent = data.activityDate + '｜' + (data.venue || '');

      var banner = document.getElementById('inviteBanner');
      if (data.inviteStatus === '邀請中' || data.inviteStatus === '未聯絡') {
        banner.innerHTML = '<div class="banner">請確認是否出席本次活動：' +
          '<div class="actions">' +
          '<button onclick="respond(\'accept\')">接受邀請</button>' +
          '<button class="secondary" onclick="respond(\'decline\')">婉拒</button>' +
          '</div></div>';
      } else {
        banner.innerHTML = '<div class="banner">邀請狀態：' + data.inviteStatus + '</div>';
      }

      var card = document.getElementById('fieldsCard');
      card.innerHTML = '';
      data.fields.forEach(function (f) {
        var div = document.createElement('div');
        div.className = 'field';
        var statusClass = (f.status === '已完成' || f.status === '已送出') ? 'done' : (f.status === '逾期' ? 'overdue' : (f.status === '填寫中' ? 'filling' : ''));
        div.innerHTML =
          '<label>' + f.labelZh + (f.required ? ' *' : '') + '<span class="status ' + statusClass + '">' + f.status + '</span></label>' +
          '<div class="meta">截止日：' + f.deadline + '</div>' +
          renderInput_(f);
        card.appendChild(div);
      });

      var saveBar = document.createElement('div');
      saveBar.className = 'actions';
      saveBar.innerHTML = '<button class="secondary" onclick="saveAll(false)">存草稿</button><button onclick="saveAll(true)">送出</button>';
      card.appendChild(saveBar);
    }

    function renderInput_(f) {
      var id = 'f_' + f.fieldKey;
      if (f.fieldType === 'textarea') {
        return '<textarea id="' + id + '">' + (f.value || '') + '</textarea>';
      }
      if (f.fieldType === 'date') {
        return '<input type="date" id="' + id + '" value="' + (f.value || '') + '">';
      }
      if (f.fieldType === 'select') {
        var opts = (f.options || []).map(function (o) {
          return '<option value="' + o + '"' + (o === f.value ? ' selected' : '') + '>' + o + '</option>';
        }).join('');
        return '<select id="' + id + '"><option value="">請選擇</option>' + opts + '</select>';
      }
      if (f.fieldType === 'file') {
        return '<input type="file" id="' + id + '" data-fieldkey="' + f.fieldKey + '">' +
          (f.value ? '<div class="meta">已上傳一份檔案</div>' : '');
      }
      return '<input type="text" id="' + id + '" value="' + (f.value || '') + '">';
    }

    function respond(decision) {
      google.script.run.withSuccessHandler(load).withFailureHandler(showError).submitInvitationResponse(TOKEN, decision);
    }

    function saveAll(isSubmit) {
      var inputs = document.querySelectorAll('#fieldsCard [id^="f_"]');
      inputs.forEach(function (el) {
        if (el.type === 'file') {
          if (el.files && el.files[0]) uploadOne_(el);
          return;
        }
        var fieldKey = el.id.substring(2);
        google.script.run.submitField(TOKEN, fieldKey, el.value, isSubmit);
      });
      setTimeout(load, 600);
    }

    function uploadOne_(el) {
      var file = el.files[0];
      var reader = new FileReader();
      reader.onload = function () {
        var base64 = reader.result.split(',')[1];
        google.script.run.withFailureHandler(showError).submitFileUpload(TOKEN, {
          fileName: file.name, mimeType: file.type, base64Data: base64,
          fileType: guessFileType_(el.dataset.fieldkey), fieldKey: el.dataset.fieldkey
        });
      };
      reader.readAsDataURL(file);
    }

    function guessFileType_(fieldKey) {
      var key = fieldKey.toLowerCase();
      if (key.indexOf('cv') !== -1) return 'CV';
      if (key.indexOf('photo') !== -1) return 'Photo';
      if (key.indexOf('deck') !== -1) return 'Deck';
      return 'Other';
    }

    if (TOKEN) load();
  </script>
</body>
</html>
